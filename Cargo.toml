[package]
name = "mcanvas"
version = "0.1.0"
edition = "2021"

[dependencies]
rfd = "0.17"
slint = "1.17"
typst = "0.15"
typst-layout = "0.15"
typst-svg = "0.15"
typst-kit = { version = "0.15", features = ["embedded-fonts", "scan-fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
arboard = { version = "3", default-features = false }

[build-dependencies]
slint-build = "1.17"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
